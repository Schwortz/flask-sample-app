[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-sample-app"
version = "0.2.0"
description = "Sample Flask application with an in-memory items API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["flask>=3.1,<3.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "requests>=2.32",
    "mypy>=1.13",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["app", "tests", "run.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
